[tools]
# Programming language runtimes
node = "lts"
rust = { version = "latest", components = [
  "rust-src", # Pre-install standard-library sources for later use by rust-analyzer
] }

# Developer tools
powershell = "latest"
gh = "latest"
flyctl = "latest"     # See also `sprite`, configured separately below

# AI coding agents and integrations
codex = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest" # `node` is a runtime dependency
oh-my-pi = "latest"

# Miscellaneous
yt-dlp = { version = "latest", lazy = true }

# Other tools not currently available via the mise registry
[tools."http:sprite"]
version = "latest"
url = 'https://sprites-binaries.t3.storage.dev/client/{{ version }}/sprite-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}{{ os(windows=".exe", linux="", macos="") }}'
version_list_url = "https://sprites-binaries.t3.storage.dev/client/latest"
checksum_url = "https://sprites-binaries.t3.storage.dev/client/{{ version }}/manifest.json"
checksum_expr = '''
let vendor_arch = arch == "x64" ? "x86_64" : arch == "arm64" ? "aarch64" : arch;
let entry = fromJSON(body).platforms[os + "-" + vendor_arch];
entry.hash + ":" + entry.digest
'''


[settings]
self_update.auto = true
minimum_release_age = "3d"
tool_update.global_auto = true
idiomatic_version_file_enable_tools = ["rust"]


# TODO: Re-enable once the Windows updater no longer opens a terminal window
# whose closure stops the service: https://github.com/jdx/mise/issues/14313
